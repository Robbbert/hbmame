# Builds HBMAME.app for macOS (Apple Silicon) from upstream HBMAME:
# SDL3.framework bundled, signed with the Developer ID, notarized and stapled,
# delivered as a signed, notarized and stapled DMG.
#
# Runs ONLY when started by hand: Actions tab -> "macOS release build" -> Run workflow.
# The app files (launcher, Info.plist, icon, entitlements) come from macos/ in this repo.

name: macOS release build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream tag, branch or commit to build (e.g. tag2894 or master)'
        required: true
        default: 'master'
      repository:
        description: 'Source repository (leave as is for upstream HBMAME)'
        required: true
        default: 'Robbbert/hbmame'
      release_tag:
        description: 'Release tag/version for file names and the release, e.g. 0.289.4 (empty = commit hash)'
        required: false
        default: ''
      publish:
        description: 'Publish as a GitHub release (needs release_tag and signing secrets)'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the release as pre-release'
        type: boolean
        default: true
      sdl_version:
        description: 'SDL3 version, e.g. 3.2.24 (empty = newest SDL 3 release)'
        required: false
        default: ''

permissions:
  contents: write   # needed only for creating the release

env:
  MACOSX_DEPLOYMENT_TARGET: '13.0'
  CAN_SIGN: ${{ secrets.MACOS_CERTIFICATE != '' }}

jobs:
  build:
    runs-on: macos-15          # Apple Silicon runner
    timeout-minutes: 340
    steps:
    - name: Check inputs
      run: |
        if [ "${{ inputs.publish }}" = "true" ]; then
          if [ -z "${{ inputs.release_tag }}" ]; then
            echo "::error::Publishing needs a release_tag."; exit 1
          fi
          if [ "$CAN_SIGN" != "true" ]; then
            echo "::error::Publishing needs the signing secrets (MACOS_CERTIFICATE etc.)."; exit 1
          fi
        fi

    - name: Check out this repository (app bundle files)
      uses: actions/checkout@v5
      with:
        path: fork

    - name: Check out HBMAME source
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        fetch-depth: 1
        path: src

    - name: Work out names
      working-directory: src
      run: |
        SRC_SHA=$(git rev-parse HEAD)
        LABEL="${{ inputs.release_tag }}"
        [ -z "$LABEL" ] && LABEL="${SRC_SHA:0:9}"
        echo "SRC_SHA=$SRC_SHA" >> "$GITHUB_ENV"
        echo "LABEL=$LABEL" >> "$GITHUB_ENV"
        echo "APP=$RUNNER_TEMP/dist/HBMAME.app" >> "$GITHUB_ENV"
        echo "DMG=HBMAME-$LABEL-macos-arm64.dmg" >> "$GITHUB_ENV"
        echo "Building ${{ inputs.repository }} @ ${{ inputs.ref }} ($SRC_SHA)"

    - name: Install SDL3.framework into /Library/Frameworks
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -n "${{ inputs.sdl_version }}" ]; then
          TAG="release-${{ inputs.sdl_version }}"
        else
          # newest non-prerelease SDL 3 release (SDL 2 releases are skipped)
          TAG=$(gh api 'repos/libsdl-org/SDL/releases?per_page=40' \
                -q '[.[] | select(.tag_name | startswith("release-3.")) | select(.prerelease | not)][0].tag_name')
        fi
        echo "Using SDL $TAG"
        gh release download "$TAG" --repo libsdl-org/SDL --pattern 'SDL3-*.dmg' --dir "$RUNNER_TEMP"
        hdiutil attach "$RUNNER_TEMP"/SDL3-*.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/sdl3"
        # the DMG ships an .xcframework; install only its macOS slice
        FW=$(find "$RUNNER_TEMP/sdl3" -maxdepth 4 -type d -path '*macos*' -name SDL3.framework | head -1)
        [ -z "$FW" ] && { echo "::error::macOS SDL3.framework not found in DMG"; exit 1; }
        sudo ditto "$FW" /Library/Frameworks/SDL3.framework
        hdiutil detach "$RUNNER_TEMP/sdl3"
        ls /Library/Frameworks/SDL3.framework/Headers/SDL.h
        vtool -show-build /Library/Frameworks/SDL3.framework/SDL3 | grep minos

    - name: Build HBMAME
      working-directory: src
      # USE_LIBSDL=0: without it the build silently switches to Homebrew's SDL3
      #   whenever it can find one (the runner has Homebrew).
      # SDL_FRAMEWORK_PATH: the default points inside SDL3.xcframework; this uses
      #   /Library/Frameworks/SDL3.framework for headers and linking.
      run: make REGENIE=1 USE_LIBSDL=0 SDL_FRAMEWORK_PATH=/Library/Frameworks/ -j$(sysctl -n hw.ncpu) TARGET=hbmame

    - name: Check linking, minimum macOS version, drivers
      working-directory: src
      run: |
        otool -L hbmame | grep -i sdl
        if otool -L hbmame | grep -q /opt/homebrew; then
          echo "::error::hbmame is linked against Homebrew libraries"; exit 1
        fi
        vtool -show-build hbmame | grep minos
        ./hbmame -validate
        # App version from the binary itself, e.g. "0.289.4x (automated)" -> 0.289.4
        VERSION=$(./hbmame -version | grep -oE '^[0-9]+(\.[0-9]+)+' | head -1)
        [ -z "$VERSION" ] && { echo "::error::Could not read version from hbmame"; exit 1; }
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "App version: $VERSION"

    - name: Compile UI translations
      working-directory: src
      run: |
        for x in language/*/*.po; do
          python3 scripts/build/msgfmt.py --output-file "$(dirname "$x")/$(basename "$x" .po).mo" "$x"
        done

    - name: Assemble HBMAME.app
      run: |
        C="$APP/Contents"
        mkdir -p "$C/MacOS" "$C/Frameworks" "$C/Resources"

        # program, launcher (main executable), Info.plist, icon
        cp src/hbmame "$C/MacOS/hbmame"
        cp fork/macos/hbmame-launcher "$C/MacOS/hbmame-launcher"
        chmod +x "$C/MacOS/hbmame" "$C/MacOS/hbmame-launcher"
        cp fork/macos/Info.plist "$C/Info.plist"
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$C/Info.plist"
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$C/Info.plist"
        plutil -lint "$C/Info.plist"
        cp fork/macos/hbmame.icns "$C/Resources/"

        # read-only runtime files
        (cd src && rsync -a --exclude='*.po' plugins language bgfx hash artwork "$C/Resources/")

        # bundled SDL3, without Finder or AppleDouble leftovers
        ditto --norsrc --noextattr --noqtn /Library/Frameworks/SDL3.framework "$C/Frameworks/SDL3.framework"

        # rpath: only the bundled framework
        BIN="$C/MacOS/hbmame"
        for rp in $(otool -l "$BIN" | awk '/cmd LC_RPATH/{getline; getline; print $2}'); do
          install_name_tool -delete_rpath "$rp" "$BIN"
        done
        install_name_tool -add_rpath @executable_path/../Frameworks "$BIN"
        otool -l "$BIN" | grep -A2 LC_RPATH

        # no .DS_Store, ._* files or extended attributes anywhere in the bundle
        find "$APP" \( -name '.DS_Store' -o -name '._*' \) -print -delete
        xattr -cr "$APP"
        ls -la "$C/Frameworks/SDL3.framework"

    - name: Import signing certificate
      if: env.CAN_SIGN == 'true'
      env:
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      run: |
        KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PW=$(openssl rand -base64 24)
        echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
        security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        rm "$RUNNER_TEMP/cert.p12"
        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')
        [ -z "$IDENTITY" ] && { echo "::error::No Developer ID Application identity in certificate"; exit 1; }
        echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

        # helper: notarize a file and fail with Apple's log if it is not accepted
        cat > "$RUNNER_TEMP/notarize.sh" <<'EOF'
        #!/bin/bash
        set -euo pipefail
        OUT=$(xcrun notarytool submit "$1" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 1h --output-format json)
        echo "$OUT"
        ID=$(echo "$OUT" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
        STATUS=$(echo "$OUT" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
        if [ "$STATUS" != "Accepted" ]; then
          xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
          echo "::error::Notarization of $1: $STATUS"; exit 1
        fi
        EOF
        chmod +x "$RUNNER_TEMP/notarize.sh"

    - name: Sign HBMAME.app (inside out)
      run: |
        C="$APP/Contents"
        if [ "$CAN_SIGN" = "true" ]; then
          codesign --force --timestamp --options runtime --sign "$IDENTITY" "$C/Frameworks/SDL3.framework"
          codesign --force --timestamp --options runtime --sign "$IDENTITY" \
            --entitlements fork/macos/hbmame.entitlements "$C/MacOS/hbmame"
          codesign --force --timestamp --options runtime --sign "$IDENTITY" "$APP"
        else
          # unsigned test build: ad-hoc signature so it can at least run locally
          codesign --force --deep --sign - "$APP"
        fi
        codesign --verify --deep --strict --verbose=2 "$APP"
        codesign -d --entitlements - "$C/MacOS/hbmame"
        # smoke test: SDL must load from inside the bundle
        "$C/MacOS/hbmame" -version

    - name: Notarize and staple HBMAME.app
      if: env.CAN_SIGN == 'true'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/HBMAME-notarize.zip"
        "$RUNNER_TEMP/notarize.sh" "$RUNNER_TEMP/HBMAME-notarize.zip"
        xcrun stapler staple "$APP"
        xcrun stapler validate "$APP"
        spctl --assess --type execute -vv "$APP"

    - name: Create DMG
      run: |
        STAGE="$RUNNER_TEMP/dmg"
        mkdir -p "$STAGE"
        ditto "$APP" "$STAGE/HBMAME.app"
        ln -s /Applications "$STAGE/Applications"
        # hdiutil occasionally reports "Resource busy" on CI runners: retry
        for i in 1 2 3 4 5; do
          hdiutil create -volname "HBMAME $LABEL" -srcfolder "$STAGE" -ov -format UDZO "$DMG" && break
          echo "hdiutil failed, retrying ($i)"; sleep 10
        done
        [ -f "$DMG" ] || { echo "::error::DMG creation failed"; exit 1; }

    - name: Sign, notarize and staple DMG
      if: env.CAN_SIGN == 'true'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        codesign --force --timestamp --sign "$IDENTITY" "$DMG"
        "$RUNNER_TEMP/notarize.sh" "$DMG"
        xcrun stapler staple "$DMG"
        xcrun stapler validate "$DMG"
        spctl --assess --type open --context context:primary-signature -vv "$DMG"

    - name: Remove signing keychain
      if: always() && env.CAN_SIGN == 'true'
      run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

    - name: Upload DMG
      # archive: false uploads the DMG as is (no extra zip around it)
      uses: actions/upload-artifact@v7
      with:
        path: ${{ env.DMG }}
        archive: false
        if-no-files-found: error

    - name: Publish GitHub release
      if: inputs.publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PRE=""
        [ "${{ inputs.prerelease }}" = "true" ] && PRE="--prerelease"
        cat > "$RUNNER_TEMP/notes.md" <<EOF
        HBMAME $LABEL as a macOS app for Apple Silicon, signed and notarized.

        Built from ${{ inputs.repository }} @ \`${{ inputs.ref }}\` (commit $SRC_SHA).

        **Install:** open the DMG and drag HBMAME to Applications. Requires macOS 13 or newer.
        SDL3 is included, nothing else needs to be installed.

        - On first launch, HBMAME creates its folders and a full \`hbmame.ini\` in
          \`~/Library/Application Support/hbmame\`. Put your ROMs into its \`roms\` folder,
          or point \`rompath\` in \`hbmame.ini\` to your ROM folder.
        - Frontends: use \`/Applications/HBMAME.app/Contents/MacOS/hbmame-launcher\` as the
          emulator; all arguments are passed through to HBMAME.
        - Merged ROM sets: run *Audit media* once in the UI so clones appear under "Available".
        EOF
        gh release create "${{ inputs.release_tag }}" "$DMG" \
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --title "HBMAME ${{ inputs.release_tag }} (macOS app)" \
          --notes-file "$RUNNER_TEMP/notes.md" $PRE
